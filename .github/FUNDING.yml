# GitHub에서 지원하는 후원 플랫폼

# github: # GitHub Sponsors를 사용하는 계정 이름을 최대 4개 입력합니다. 예시 [user1, user2]
# patreon: # Patreon 사용자 이름 1개를 입력합니다.
# open_collective: # Open Collective 사용자 이름 1개를 입력합니다.
# ko_fi: # Ko-fi 사용자 이름 1개를 입력합니다.
# tidelift: # Tidelift의 플랫폼 이름/패키지 이름을 입력합니다. 예시 npm/babel
# community_bridge: # Community Bridge 프로젝트 이름 1개를 입력합니다. 예시 cloud-foundry
# liberapay: # Liberapay 사용자 이름 1개를 입력합니다.
# issuehunt: # IssueHunt 사용자 이름 1개를 입력합니다.
# lfx_crowdfunding: # LFX Crowdfunding 프로젝트 이름 1개를 입력합니다. 예시 cloud-foundry
# polar: # Polar 사용자 이름 1개를 입력합니다.
# buy_me_a_coffee: # Buy Me a Coffee 사용자 이름 1개를 입력합니다.
# thanks_dev: # thanks.dev 사용자 이름 1개를 입력합니다.
# custom: # 별도 후원 링크를 최대 4개 입력합니다. 예시 ['link1', 'link2']
custom: ['https://donatex.gg/donate/bulat_chu', 'https://github.com/park-csu/cabbageworm/blob/main/.github/additional-funding-methods.md']
